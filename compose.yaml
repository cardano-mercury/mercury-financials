services:
  db:
    image: postgres:16
    restart: always
    ports:
      - ${PG_PORT:-5432}:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: always
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
