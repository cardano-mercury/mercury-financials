name: Release PR

# Keeps a "Release vX.Y.Z" pull request open against main, holding everything on development that has
# not shipped yet.
#
# This is what lets main stay strictly gated. Nothing pushes to main: the version bump and the
# assembled changelog arrive as an ordinary pull request, which runs the same CI as any other, and
# merging it is the act that publishes. No bot needs permission to bypass branch protection.
#
# It runs after CI succeeds on development, so a release PR can only ever be raised from a green
# commit.
#
# The pull request is opened as the org's Mercury Release Bot, not with GITHUB_TOKEN, and that is
# load-bearing rather than cosmetic. GitHub refuses to let a workflow run created with GITHUB_TOKEN
# trigger further workflow runs, so a release PR opened that way gets **no checks at all**: they come
# back `action_required`, and they cannot be approved (`POST /actions/runs/{id}/approve` answers 403,
# "This run is not from a fork pull request"). main requires those checks, so the release could never
# merge, and it would present as an absence of checks rather than as an error. A GitHub App
# installation token is a real actor, so what it pushes runs CI normally.
#
# Setup is in mercury-core/.claude/app-setup/README.md. The App is installed org-wide and its two
# values are org-level, so there is nothing to configure per repo.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  open:
    name: Open or update the release PR
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Mint an installation token for the Mercury Release Bot. Skipped when the App is not
      # configured, so the workflow still assembles the release; its pull request just will not have
      # working checks, and the body below says so rather than leaving the next person to work it out.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
          # The token the later `git push` inherits. This is the half people forget: authenticating
          # `gh` but leaving checkout on the default token means the branch is still pushed by
          # GITHUB_TOKEN, and the pull request still gets no checks.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The release has to pass the same gate as anything else, and that gate includes
      # `prettier --check`. So the files this workflow writes must be formatted, which means Prettier
      # has to be installed here.
      - run: npm ci

      # Ask the tool, do not count files. A set of `none` fragments is a perfectly valid set that
      # releases nothing, so counting files would send this workflow off to assemble a release that
      # `assemble` then rightly refuses to make, and the run would fail on development for no reason.
      - name: Anything to release?
        id: pending
        run: |
          set -euo pipefail
          version="$(node scripts/changes.mjs next)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "::notice::Nothing pending that moves the version. No release to open."
          fi

      # Assemble on a branch: bump package.json, write the CHANGELOG section, delete the fragments.
      # The branch is rebuilt from development every time, so it always reflects the current state
      # rather than accumulating stale commits.
      - name: Assemble the release
        if: steps.pending.outputs.version != ''
        id: assemble
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "mercury-release-bot[bot]"
          git config user.email "mercury-release-bot[bot]@users.noreply.github.com"

          version="$(node scripts/changes.mjs assemble "$(date -u +%Y-%m-%d)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Belt and braces. The generator produces Prettier-clean output, but a release that cannot
          # pass its own `lint` can never merge, and that failure would only surface here, on the one
          # pull request nobody can bypass. Formatting what we just wrote costs nothing.
          npx prettier --write CHANGELOG.md package.json

          git checkout -B "release/v$version"
          git add -A
          git commit -m "Release v$version"
          git push --force origin "release/v$version"

      - name: Open or update the pull request
        if: steps.pending.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.assemble.outputs.version }}
          APP_CONFIGURED: ${{ steps.app-token.outputs.token != '' }}
        run: |
          set -euo pipefail

          notes="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md)"

          warning=''
          if [ "$APP_CONFIGURED" != "true" ]; then
            warning='> **This pull request has no checks, and cannot get any.**
          > It was opened with `GITHUB_TOKEN`, and GitHub does not let a workflow run created with that
          > token trigger further workflow runs. The checks will sit at `action_required` and cannot be
          > approved. Configure the Mercury Release Bot (see `mercury-core/.claude/app-setup/README.md`)
          > and re-run this workflow.

          '
          fi

          body="$(printf '%sAssembled from the change fragments on \140development\140.\n\n**Merge this with a merge commit, not a squash.** A squash gives \140main\140 a commit that shares no ancestor with \140development\140, and every later release pull request then diffs against the beginning of the repository instead of against the last release.\n\nMerging publishes **v%s**: CI runs, then the release workflow pushes the images to GHCR, tags \140v%s\140, and cuts the GitHub release.\n\n---\n%s\n' "$warning" "$VERSION" "$VERSION" "$notes")"

          existing="$(gh pr list --base main --head "release/v$VERSION" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Release v$VERSION" --body "$body"
            echo "updated PR #$existing"
          else
            # Close any superseded release PR, so only one is ever open.
            for n in $(gh pr list --base main --json number,headRefName \
                        --jq '.[] | select(.headRefName | startswith("release/v")) | .number'); do
              gh pr close "$n" --comment "Superseded by Release v$VERSION." || true
            done
            gh pr create --base main --head "release/v$VERSION" \
              --title "Release v$VERSION" --body "$body"
            echo "opened the release PR for v$VERSION"
          fi
