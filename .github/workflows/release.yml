name: Release

# Build and push the two images the deploy stack pulls, so the demo host never has to build.
#
# Two images, not one: the runner is installed with `npm ci --omit=dev` and drizzle-kit is a
# devDependency, so the runner cannot migrate. The compose stack runs the migrate image as a one-shot
# before the app starts (after core's own `mercury-core migrate`, which must go first because
# tokenomics foreign-keys to the shared "user" table).
#
#   ghcr.io/cardano-mercury/mercury-financials          (target: runner)
#   ghcr.io/cardano-mercury/mercury-financials-migrate  (target: migrate)
#
# A v* tag cuts a release. Pushes to main refresh the rolling `main` tag so the demo host can track
# it without waiting for a version bump.

# `rewrite/sveltekit` is listed alongside main because the app currently lives there: main still
# holds only the LICENSE, README and the PRD. Drop it from this list once the rewrite lands on main.
# A `v*` tag fires this from any branch, so a release can be cut before that merge happens.
on:
  push:
    branches: [main, rewrite/sveltekit]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Never publish an image that would not have passed a PR. This is the same gate as ci.yml, run
  # again here because a tag can point anywhere.
  gate:
    name: Lint, check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      # Deliberately no env: the build must not need production secrets. See ci.yml.
      - run: npm run build

  publish:
    name: Push ${{ matrix.image }} to GHCR
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mercury-financials
            target: runner
          - image: mercury-financials-migrate
            target: migrate

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The built-in GITHUB_TOKEN is enough to push to this repo's own packages. No PAT to manage.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Single-context build: @cardano-mercury/core comes from npm, so nothing outside this repo is
      # needed. amd64 only; add linux/arm64 here if the demo VM ever turns out to be ARM (it roughly
      # doubles build time, so it is not on by default).
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # A published image with a secret in it is worse than no image. This is cheap, so it runs on
      # every push rather than being left to a runbook someone forgets. Mirrors core's
      # deploy/audit-images.sh.
      - name: Audit the pushed image for baked-in secrets
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:sha-$(git rev-parse --short HEAD)"
          echo "auditing $IMAGE"
          if docker run --rm --entrypoint sh "$IMAGE" -c 'ls -a /app 2>/dev/null' | grep -qE '^\.env'; then
            echo "::error::an .env file is present in $IMAGE"
            exit 1
          fi
          echo "no .env in the image"
