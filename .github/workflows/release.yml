name: Release

# Publishing is deliberately downstream of testing, and never runs on a pull request.
#
# This is triggered by CI *succeeding on main*, not by the push itself, so an image can only be built
# from a commit whose gate went green. A pull request therefore gets tested exactly as hard as a
# release, with no chance of shipping anything.
#
# It then publishes only if package.json carries a version that has not been released before. That is
# what makes "release only when semver was stepped" true rather than a convention: merge a change
# that forgot to bump, and this stops at the guard. (version.yml refuses to let such a PR into main
# in the first place; this is the backstop.)
#
# Artifacts:
#   ghcr.io/cardano-mercury/mercury-financials          (target: runner)
#   ghcr.io/cardano-mercury/mercury-financials-migrate  (target: migrate)
#
# Two images, not one, because the runner is installed with `npm ci --omit=dev` and drizzle-kit is a
# devDependency, so the runner cannot migrate. The deploy stack runs the migrate image as a one-shot
# before the app starts.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  guard:
    name: Is this version unreleased?
    runs-on: ubuntu-latest
    # A failed or cancelled CI run must not publish. workflow_dispatch has no such run to inspect.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      publish: ${{ steps.v.outputs.publish }}
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the exact commit CI validated, not whatever main happens to be now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - id: v
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::notice::v$version is already released. Nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v$version is new. Publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Push ${{ matrix.image }}
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - image: mercury-financials
            target: runner
          - image: mercury-financials-migrate
            target: migrate

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      # The built-in GITHUB_TOKEN can push to this repo's own packages. No PAT to manage.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.guard.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # Single-context build: @cardano-mercury/core comes from npm, so nothing outside this repo is
      # needed. amd64 only; add linux/arm64 if the host ever turns out to be ARM (it roughly doubles
      # build time, so it is not on by default).
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # A published image with a secret in it is worse than no image. Cheap, so it runs every time
      # rather than living in a runbook someone forgets. An earlier build baked .env in, because
      # docker reads .dockerignore from the build-context root and the context was the parent
      # directory. It is fixed, but the check stays.
      - name: Audit the pushed image for a baked-in .env
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.guard.outputs.version }}"
          if docker run --rm --entrypoint sh "$image" -c 'ls -a /app 2>/dev/null' | grep -qE '^\.env'; then
            echo "::error::an .env file is present in $image"
            exit 1
          fi
          echo "no .env in $image"

  tag:
    name: Tag and release v${{ needs.guard.outputs.version }}
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The same org App as release-pr.yml, so a release is attributed to the Mercury Release Bot
      # rather than to a generic action. Nothing here depends on the token triggering a workflow (no
      # workflow runs on tags), so GITHUB_TOKEN would work; the App is for a coherent audit trail.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # Tag only once the images are actually in the registry, so a tag always means a real release.
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "mercury-release-bot[bot]"
          git config user.email "mercury-release-bot[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

          # Lift this version's section out of the changelog for the release notes, so they are
          # written by a person rather than generated from commit subjects.
          notes="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md)"
          [ -n "$notes" ] || notes="See CHANGELOG.md."

          printf '%s\n' "$notes" | gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file -
